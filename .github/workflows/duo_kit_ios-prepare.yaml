name: duo_kit_ios prepare

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/duo_kit_ios/**'
      # duo_kit_ios depends on duo_kit.
      - 'packages/duo_kit/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
      - '.github/workflows/duo_kit_ios-prepare.yaml'

jobs:
  prepare:
    name: Flutter ${{ matrix.flutter-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        flutter-version: ['3.41.x']
        flutter-channel: ['stable']

    defaults:
      run:
        working-directory: packages/duo_kit_ios

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          channel: ${{ matrix.flutter-channel }}

      # Resolves the whole pub workspace.
      - name: flutter pub get
        run: flutter pub get

      - name: flutter test
        if: success() || failure()
        run: flutter test

      - name: Run analyzer
        if: success() || failure()
        run: flutter analyze

      - name: dart format
        if: success() || failure()
        run: dart format --set-exit-if-changed .

      - name: flutter pub publish --dry-run
        if: success() || failure()
        run: flutter pub publish --dry-run

  pana-score:
    name: pana score
    runs-on: ubuntu-latest

    permissions:
      contents: read
      statuses: write

    steps:
      - name: Clone repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Score with pana
        continue-on-error: true
        uses: leancodepl/mobile-tools/.github/actions/pana-score@e9f138c252f8e2254c88273367958fcc6bb39cad # pana-score-v1.3
        with:
          path: packages/duo_kit_ios
