name: publish

on:
  push:
    tags: ['duo_kit-v*', 'duo_kit_ios-v*']

jobs:
  publish:
    name: Publish ${{ github.ref_name }} to pub.dev

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A tag such as duo_kit_ios-v0.1.0 publishes packages/duo_kit_ios.
      - name: Pick the package
        id: package
        run: echo "path=packages/${GITHUB_REF_NAME%-v*}" >> "$GITHUB_OUTPUT"

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.x
          cache: true

      - name: Publish and release
        uses: leancodepl/mobile-tools/.github/actions/pub-release@pub-release-v1
        with:
          path: ${{ steps.package.outputs.path }}
