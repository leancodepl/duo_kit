name: test

on:
  push:
    branches: [ main ]
    tags-ignore: ['*-v*']
  pull_request:

jobs:
  test:
    name: Test on Flutter ${{ matrix.version }}

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['3.41.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.version }}
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.FLUTTER_HOME }}/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-pub-

      # Resolves the whole pub workspace, the package and its example.
      - name: Download pub dependencies
        run: flutter pub get

      # Covers the example app too.
      - name: Run analyzer
        run: flutter analyze

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run tests
        run: flutter test

      - name: Dry run pub publish
        # We don't want it to fail the CI, it's just to see how would `pub publish` behave.
        run: dart pub publish --dry-run || true

  build-example-ios:
    name: Build the example on ${{ matrix.runner }} with ${{ matrix.dependencies }}

    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Xcode 26.6 compiles the bridge to nothing; Xcode 27.1 compiles it.
        runner: [macos-26, xcode-27]
        dependencies: [CocoaPods, Swift Package Manager]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
          cache: true

      - name: Enable Swift Package Manager
        if: matrix.dependencies == 'Swift Package Manager'
        run: flutter config --enable-swift-package-manager

      - name: Build the example
        working-directory: example
        run: flutter build ios --debug --no-codesign

  pana-score:
    name: pana score

    runs-on: ubuntu-latest

    permissions:
      contents: read
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Score with pana
        continue-on-error: true
        uses: leancodepl/mobile-tools/.github/actions/pana-score@e9f138c252f8e2254c88273367958fcc6bb39cad # pana-score-v1.3
        with:
          path: .
