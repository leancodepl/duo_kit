name: duo_kit
description: 'iPhone Duo and foldable layouts for Flutter: navigation in the strip, a split view across the fold and dialogs in one half, around your own widgets.'
version: 0.1.0
homepage: https://github.com/leancodepl/duo_kit
repository: https://github.com/leancodepl/duo_kit
issue_tracker: https://github.com/leancodepl/duo_kit/issues

topics:
  - iphone-duo
  - foldable
  - dual-screen
  - layout
  - adaptive

screenshots:
  - description: Two panes move to either side of the fold as iPhone Duo opens like a book.
    path: doc/imgs/hero.gif
  - description: The strip, the camera, the status cluster and the fold in four iPhone Duo poses.
    path: doc/imgs/geometry.png

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  leancode_lint: ^21.0.0
